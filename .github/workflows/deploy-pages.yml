name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn test --watchAll=false
      - run: yarn build
        env:
          DISABLE_ESLINT_PLUGIN: true
          REACT_APP_BACKEND_URL: ${{ vars.CARDIQ_BACKEND_URL || 'https://api.findmybest.cards' }}
          REACT_APP_PUBLIC_APP_URL: https://findmybest.cards
      - name: Generate SEO pages from this commit
        if: github.event_name == 'push'
        run: python3 ../scripts/generate_static_catalog_pages.py
        env:
          CARDIQ_PUBLIC_ORIGIN: https://findmybest.cards
      - name: Sync Admin-published cards into SEO pages
        if: github.event_name != 'push'
        run: python3 ../scripts/generate_static_catalog_pages.py
        env:
          CARDIQ_CATALOG_API_URL: ${{ format('{0}/api/cards', vars.CARDIQ_BACKEND_URL || 'https://api.findmybest.cards') }}
          CARDIQ_PUBLIC_ORIGIN: https://findmybest.cards
      - run: python3 ../scripts/test_static_catalog_pages.py
        env:
          CARDIQ_PUBLIC_ORIGIN: https://findmybest.cards
      - name: Audit sitemap targets, metadata and internal links
        run: python3 ../scripts/audit_seo.py --build build
      - name: Check reviewed comparison examples and discovery audit
        run: |
          python3 ../scripts/test_comparison_editorial.py
          python3 ../scripts/test_comparison_engine.py
          node ../scripts/test_comparison_calculator.cjs
          python3 ../scripts/test_audit_seo.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
